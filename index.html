
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b12">
<title>Personal AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b12;color:#e8eaf2;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}
.app{max-width:650px;margin:auto;min-height:100vh;display:flex;flex-direction:column;padding:20px}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 0 25px}
.logo{font-size:21px;font-weight:700;letter-spacing:1px}
.status{font-size:12px;color:#52d69a}
nav{display:flex;gap:9px;overflow-x:auto;padding-bottom:20px}
nav button{background:#171b27;color:#aeb5c8;border:1px solid #292e3e;padding:11px 15px;border-radius:12px;white-space:nowrap}
nav button.active{background:#28334d;color:white;border-color:#657fae}
main{flex:1}
h1{font-size:29px;margin:15px 0 8px}
.subtitle{color:#8992a8;font-size:14px}
.panel{background:#111622;border:1px solid #242b3a;border-radius:18px;padding:18px;margin:17px 0}
.panel h3{margin:0 0 10px}
.message{background:#1b2435;border-radius:15px;padding:14px;margin:15px 0;color:#dce3f5;line-height:1.5}
.message.ai{background:#121c1c;border:1px solid #23443a}
input{width:100%;background:#171d2a;border:1px solid #30394b;border-radius:13px;padding:15px;color:white;font-size:16px;outline:none}
.send{background:#8bafff;color:#080d18;border:0;border-radius:13px;padding:14px 20px;font-weight:700}
.composer{display:flex;gap:9px;margin-top:20px}
.item{padding:13px 0;border-bottom:1px solid #242b3a;color:#c5cce0}
.item:last-child{border:0}
footer{text-align:center;color:#626d83;font-size:12px;padding:20px}
</style>
</head>
<body>
<div class="app">
<header>
<div class="logo">◈ PERSONAL AI</div>
<div class="status">● SYSTEM ONLINE</div>
</header>

<nav>
<button class="active" onclick="showPage('home',this)">Главная</button>
<button onclick="showPage('agent',this)">Агент</button>
<button onclick="showPage('apps',this)">Приложения</button>
<button onclick="showPage('settings',this)">Настройки</button>
</nav>

<main id="content">
<h1>Привет.</h1>
<div class="subtitle">Твой персональный искусственный интеллект.</div>

<div class="panel">
<h3>Личный помощник</h3>
<div class="message ai">Система готова к работе. Чем могу помочь?</div>
<div id="chat"></div>
<div class="composer">
<input id="question" placeholder="Напиши сообщение..." onkeydown="if(event.key==='Enter')sendMessage()">
<button class="send" onclick="sendMessage()">➤</button>
</div>
</div>

<div class="panel">
<h3>Состояние системы</h3>
<div class="item">● Интерфейс — активен</div>
<div class="item">○ Telegram — не подключён</div>
<div class="item">○ Другие сервисы — не подключены</div>
</div>
</main>

<footer>PERSONAL AI · PRIVATE SYSTEM</footer>
</div>

<script>
function showPage(page,button){
document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
button.classList.add('active');

const pages={
home:`<h1>Привет.</h1><div class="subtitle">Твой персональный искусственный интеллект.</div>
<div class="panel"><h3>Личный помощник</h3><div class="message ai">Система готова к работе. Чем могу помочь?</div><div id="chat"></div><div class="composer"><input id="question" placeholder="Напиши сообщение..." onkeydown="if(event.key==='Enter')sendMessage()"><button class="send" onclick="sendMessage()">➤</button></div></div>
<div class="panel"><h3>Состояние системы</h3><div class="item">● Интерфейс — активен</div><div class="item">○ Telegram — не подключён</div><div class="item">○ Другие сервисы — не подключены</div></div>`,
agent:`<h1>ИИ-агент</h1><div class="subtitle">Управление автономной работой.</div><div class="panel"><h3>Возможности агента</h3><div class="item">Анализ информации</div><div class="item">Выполнение задач</div><div class="item">Работа с приложениями</div><div class="item">Автоматизация процессов</div><p class="subtitle">Исполнение задач будет подключено на следующем этапе.</p></div>`,
apps:`<h1>Приложения</h1><div class="subtitle">Управление внешними подключениями.</div><div class="panel"><div class="item">Telegram — не подключён</div><div class="item">GitHub — репозиторий создан</div><div class="item">OpenAI API — не подключён</div><div class="item">Добавление новых интеграций — в разработке</div></div>`,
settings:`<h1>Настройки</h1><div class="subtitle">Управление системой.</div><div class="panel"><div class="item">Режим: Personal AI</div><div class="item">Тема: тёмная</div><div class="item">Разрешения: настраиваются</div><div class="item">Версия: 0.1 MVP</div></div>`
};
document.getElementById('content').innerHTML=pages[page];
}

function sendMessage(){
const input=document.getElementById('question');
const chat=document.getElementById('chat');
if(!input||!chat||!input.value.trim())return;
const msg=document.createElement('div');
msg.className='message';
msg.textContent=input.value;
chat.appendChild(msg);
const answer=document.createElement('div');
answer.className='message ai';
answer.textContent='Сообщение принято интерфейсом. Для ответов ИИ необходимо подключить сервер и модель.';
chat.appendChild(answer);
input.value='';
}
</script>
</body>
</html>
